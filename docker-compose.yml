services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Secrets SMTP, EMAIL_MODE, etc. : lus depuis backend/.env, jamais écrits dans ce fichier.
    # Les variables de "environment" ci-dessous ont priorité sur celles du fichier.
    env_file:
      - ./backend/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_PATH: /app/clients.db
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - ./backend/clients.db:/app/clients.db
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  ollama_data:
